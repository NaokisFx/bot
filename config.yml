# ===========================================================================
# CONFIGURACIÓN DE AFK
# ===========================================================================
# Variables: {user} {userMention} {backTime} {reason}
AFK:
  Enabled: false # ¿Activar sistema AFK?
  AFKStatusCheck: 5000 # En ms, cada cuánto se revisan los estados AFK
  AllowAnyone: true # ¿Permitir a todos usar el comando AFK?
  AllowRoles: ["ROLE_ID", "ROLE_ID"] # Roles que pueden usar el comando AFK si AllowAnyone es false

  NotifyChannel: true # ¿Notificar en el canal donde se usó el comando AFK?
  NotifyMessage: "## ¡{username} está AFK! Volverá en {backTime}" # Si UseNotifyEmbed es false
  UseNotifyEmbed: true # ¿Usar embed para notificaciones en el canal?
  NotifyEmbed:
    EmbedColor: "#1769FF"
    Title: ""
    Description:
      - "## ¡{username} se ha puesto AFK!"
      - "Razón: `{reason}`"
      - "Volverá en {backTime}"
