TicketSettings:
  Enabled: true # ¿Activar sistema de tickets?
  LogsChannelID: "CHANNEL_ID" # El registro no se enviará si está vacío ""
  MaxTickets: 1 # Máximo de tickets por usuario
  DeletionTime: "5" # En segundos, pon 0 para eliminar instantáneamente
  useSelectMenu: false # ¿Usar menú desplegable en vez de botones?

Priority:
  Enabled: true # ¿Activar sistema de prioridades?
  DefaultPriority: "Low" # Prioridad por defecto

  Levels:
    Low: # Prioridad Baja
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles con esta prioridad
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles a etiquetar cuando se abre un ticket con esta prioridad
      MoveTop: false # ¿Mover el ticket al tope de la categoría?

    Medium: # Prioridad Media
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles con esta prioridad
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles a etiquetar cuando se abre un ticket con esta prioridad
      MoveTop: true # ¿Mover el ticket al tope de la categoría?

    High: # Prioridad Alta
      Roles: ["ROLE_ID", "ROLE_ID"] # Roles con esta prioridad
      Tag: ["ROLE_ID", "ROLE_ID"] # Roles a etiquetar cuando se abre un ticket con esta prioridad
      MoveTop: true # ¿Mover el ticket al tope de la categoría?

