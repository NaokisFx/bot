# ===========================================================================
# MENSAJES DEL COMANDO CHISTE OSCURO
# ===========================================================================
darkjokes:
  messages:
    - "Dale un fósforo a un hombre y tendrá calor unas horas. Préndale fuego a un hombre y tendrá calor el resto de su vida."
    - "Mi esposa y yo hemos tomado la difícil decisión de no querer hijos. Si alguien los quiere, mándame tus datos de contacto y los dejamos mañana."
    - "¿Qué le regalas a un niño sin brazos en Navidad?\nNada, de todas formas no podría abrirlo."
    - "Le quité la silla de ruedas a mi ex novia.\nAdivina quién vino arrastrándose de vuelta."
    - "¿Cuándo se convierte un chiste en chiste de papá?\nCuando se va y nunca regresa."
    - "¿Pueden los huérfanos comer en un restaurante familiar?"
    - "Un hombre entró a una biblioteca y pidió un libro sobre cómo suicidarse. El bibliotecario dijo: 'Ni lo sueñes, no lo vas a devolver.'"
    - "Mi abuela con Alzheimer solía contarnos un chiste.\nDecía 'Toc toc', le decíamos '¿Quién es?'\nLuego decía 'No me acuerdo'… y empezaba a llorar."
    - "¿Por qué los huérfanos no pueden jugar béisbol?\nNo saben dónde está el hogar."
    - "¿A dónde fue Suzy después de perderse en un campo minado?\n¡A TODAS PARTES!"
    - "Llevo dos años buscando al asesino de mi ex novia. Pero nadie quiere hacerlo."
    - "¿Cuáles fueron las últimas palabras de Stephen Hawking?\nEl sonido de cierre de Windows XP."
    - "Cuando chocas un tope en una zona escolar y recuerdas que no hay topes."
    - "Dos niños estaban golpeando a un chico en un callejón, así que intervine. No tuvo ninguna oportunidad contra los tres."
    - "Mi ex tuvo un accidente terrible. Le dije a los médicos el tipo de sangre equivocado. Ahora sí sabrá lo que es el rechazo."
    - "Cuando Jim estaba jugando con su celular, mi abuelo le dijo: '¡Usas demasiada tecnología!'. Jim respondió: '¡No, TÚ usas demasiada tecnología!' y desconectó el soporte vital del abuelo."
    - "Siempre recordaré las últimas palabras de mi abuelo: ¡Para de sacudir la escalera!"
    - "¿Te gustaría probar comida africana?\nA ellos también les gustaría."
    - "Los niños en el asiento trasero causan accidentes y los accidentes en el asiento trasero causan niños."
    - "¿Qué haces cuando terminas una revista en el hospital? Recargas y sigues disparando."
    - "¿Cómo organizas una fiesta sorpresa en un hospital?\nLleva una luz estroboscópica a la sala de epilepsia."
    - "¡Tengo un pez que sabe breakdance! Solo por 20 segundos, y solo una vez."
    - "¿Qué es lo último que pasa por la cabeza de una mosca al golpear el parabrisas de un auto a 100 km/h?\nSu trasero."
    - "Mi papá murió porque no recordábamos su tipo de sangre. Mientras moría, insistía en que fuéramos 'positivos', pero es difícil sin él."
    - "No necesitas paracaídas para hacer paracaidismo.\nNecesitas paracaídas para hacer paracaidismo dos veces."
    - "Mi novia, aficionada a la astronomía, me preguntó cómo mueren las estrellas. 'Generalmente de sobredosis', le dije."
    - "Mis parientes mayores solían bromear conmigo en las bodas diciendo '¡Tú sigues!' Dejaron de hacerlo cuando empecé a hacer lo mismo en los funerales."
    - "Mi esposa y yo tomamos la difícil decisión de no querer hijos.\nSi alguien los quiere, mándame tus datos y los dejamos mañana."
    - "Quiero morir tranquilamente en mi sueño, como mi abuelo.\nNo gritando como los pasajeros de su auto."
    - "Empecé a llorar cuando papá cortaba cebollas. Cebollas era un perro tan bueno."
    - "Si a la primera no lo logras… el paracaidismo definitivamente no es para ti."
    - "Dicen que en cada grupo de amigos hay alguien capaz de matar.\nSospechaba que era Dave, así que lo maté antes de que causara daño."
    - "Nunca olvidaré las últimas palabras de mi abuelo justo antes de morir. '¿Sigues sujetando la escalera?'"
    - "¿Qué es amarillo y no sabe nadar? Un autobús lleno de niños."
    - "El médico me dio un año de vida, así que le disparé. El juez me dio 15 años. Problema resuelto."
    - "De niños le teníamos miedo a la oscuridad.\n¡Pero de adultos, la factura de la luz nos hace tenerle miedo a la luz!"
    - "Paciente: Doctor, estoy muy nervioso. Es mi primera operación.\nDoctor: No te preocupes. La mía también."
    - "Odio cómo los funerales siempre son a las 9 de la mañana. No soy una persona mañanera de luto."
    - "¿Por qué los amigos son como la nieve? Si les haces pipí encima, desaparecen."
    - "Mi terapeuta dice que tengo una preocupación por la venganza. Ya veremos."
    - "Es importante tener buen vocabulario. Si hubiera sabido la diferencia entre 'antídoto' y 'anécdota', uno de mis mejores amigos aún estaría vivo."
    - "Dicen que eres lo que comes. No recuerdo haber comido una gran decepción."
    - "¿Por qué no puedes oír a un psiquiatra en el baño? Porque la 'P' es silenciosa."
    - "Tengo un chiste sobre la economía del goteo. Pero el 99% de ustedes nunca lo entenderá."
    - "Un nuevo estudio encontró que los humanos comen más plátanos que los monos. No recuerdo la última vez que comí un mono."
    - "Le dije a mi esposa que abrazara sus errores. Me dio un abrazo."
    - "Mi esposa dejó una nota en la nevera que decía: 'Esto no funciona, adiós.' La abrí y funciona perfectamente."
    - "Sabes que no caes bien cuando te dan la cámara cada vez que toman una foto grupal."
    - "¿Por qué los cementerios nunca se llenan? Porque la gente muere por entrar."
    - "Tengo un EpiPen. Mi amigo me lo dio cuando se estaba muriendo. Parecía muy importante para él que yo lo tuviera."
    - "Hoy fue un día terrible. Mi ex fue atropellado por un autobús y perdí mi trabajo como conductor."
    - "No planeaba salir a correr hoy, pero esos policías aparecieron de la nada."
    - "Le dije a los paramédicos el tipo de sangre equivocado de mi ex, para que sepa lo que es el rechazo."
    - "Mi consejero de duelo murió el otro día. Era tan bueno en su trabajo que ni me importa."
    - "El inventor del autocorrector murió hoy. Su funeral será hola el Domingal."
    - "Me negué a creer que mi papá robaba en su trabajo de policía de tráfico, pero cuando llegué a casa, todas las señales estaban ahí."
    - "Dale un fósforo a un hombre y tendrá calor unas horas. Préndale fuego y tendrá calor el resto de su vida."

