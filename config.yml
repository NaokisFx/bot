# ===========================================================================
# SISTEMA DE SUGERENCIAS
# ===========================================================================
SuggestionSettings:
  Enabled: true # ¿Activar sistema de sugerencias?
  ChannelID: "CHANNEL_ID" # Canal donde se publican las sugerencias
  AllowedRoles: ["ROLE_ID"] # Roles que pueden usar el comando de sugerencias
  SuggestionAcceptDenyRoles: ["ROLE_ID"] # Roles que pueden aceptar/rechazar sugerencias con /suggestion accept/deny <id>
  threadName: "{user}-sugerencia" # Variables: {user}, dejar vacío para desactivar hilos
  UseQuestionModal: true # ¿Activar el modal de preguntas al hacer una sugerencia?
  blockBlacklistWords: true # ¿Filtrar sugerencias con el Sistema de Palabras Prohibidas?
  sendDM: true # ¿Enviar DM al usuario sobre el estado de su sugerencia?

  AdditionalModalInputs: # Máximo 4 entradas adicionales
    1: # Solo funciona si UseQuestionModal es true
      ID: "product" # Se usa como {modal_product}
      Question: "¿Para qué producto es tu sugerencia?"
      Placeholder: "fluxo Bot, fluxo Tickets, Discord"
      Style: "Short" # Short (corto) o Paragraph (párrafo)
      Required: true # ¿Es obligatorio?
      maxLength: 1000

SuggestionUpvote: # Botón de voto positivo
