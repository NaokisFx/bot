# {randomLevelMessage}: Muestra un mensaje aleatorio de nivel del archivo lang.yml
# {userIcon}: Muestra el ícono del usuario
# {guildIcon}: Muestra el ícono del servidor

LevelingSystem:
  Enabled: false # ¿Activar sistema de niveles?
  ResetDataOnLeave: false # ¿Reiniciar nivel y XP si el usuario abandona el servidor?
  MessageXP: "10-20" # Rango de XP ganada por enviar mensajes
  VoiceXP: "1-3" # Rango de XP ganada por estar en un canal de voz
  XPNeeded: 150 # Multiplicador de XP por nivel
  Permission: ["ROLE_ID", "ROLE_ID"] # ¿Quién puede usar los comandos de administración de niveles?
  ChannelSettings:
    LevelUpChannelID: "" # Dejar vacío para usar el canal actual del usuario
    DisabledChannels: [""] # Los usuarios no ganarán XP en estos canales
    DisabledCategories: [""] # Los usuarios no ganarán XP en estas categorías

  CooldownSettings:
    EnableXPCooldown: true # ¿Activar tiempo de espera para ganar XP y evitar spam?
    XPCooldown: "3s" # Tiempo de espera para XP (1s/1m/1h)
    VoiceInterval: "10s" # Intervalo de XP en voz

  LevelUpMessageSettings:
    LevelUpMessage: "{user}, ahora eres nivel {level}"
    UseEmbed: true # ¿Usar embed para el mensaje de subida de nivel?
    Embed:
      Title: "🎉 ¡Subiste de Nivel!"
      Description:
        - "{randomLevelMessage}"
      Footer:
        Text: ""
        Icon: ""
      Author:
        Text: ""
        Icon: ""
      Color: "#1769FF"
      Image: ""
      Thumbnail: "{userIcon}"

  RoleSettings:
    StackRoles: false # ¿Acumular roles de nivel (mantener los anteriores)?
    LevelRoles:
      - level: 1
        roleID: "" # ID del rol que se da al llegar al nivel 1
      - level: 5
        roleID: "" # ID del rol que se da al llegar al nivel 5

    ScaleRewards:
      StackRewards: false # ¿Acumular recompensas?
      Rewards:
        - level: +1 # Por cada nivel ganado
          coins: 10 # Se dan 10 monedas

RankCard: # Diseño de la tarjeta de rango
  Background: "banner.png" # Imagen de fondo
  Font: "WinterDrink.ttf" # Fuente de texto
  OverlayOpacity: 0.6 # Opacidad de la capa superior (0-1)

  UsernameStyles: # Estilo del nombre de usuario
    UsernameColor: "#FFC0CB" # Color del nombre
    UsernameSize: "5xl" # Tamaño del nombre
    UsernameFontWeight: "font-bold" # Grosor de la fuente

  LevelTextStyles: # Estilo del texto de nivel
    LevelTextColor: "#ADD8E6" # Color del texto "Nivel"
    LevelValueColor: "#FFD700" # Color del número de nivel
    LevelTextSize: "4xl"

  RankTextStyles: # Estilo del texto de rango
    RankTextColor: "#ADD8E6"
    RankValueColor: "#FFD700"
    RankTextSize: "4xl"

  XPTextStyles: # Estilo del texto de XP
    XPTextColor: "#ADD8E6"
    XPValueColor: "#FFD700"
    XPTextSize: "4xl"

  ProgressBarStyles: # Estilo de la barra de progreso
    ProgressBarColor: "#00BFA5"

# ===========================================================================
# MODERACIÓN
# ===========================================================================
ModerationRoles: # ¿Quién puede usar estos comandos?
  reminder: ["ROLE_ID", "ROLE_ID"] # Permite establecer recordatorios para otros usuarios
  addrole: ["ROLE_ID", "ROLE_ID"] # Añadir rol a un usuario
  roleall: ["ROLE_ID", "ROLE_ID"] # Dar rol a todos los usuarios
  ban: ["ROLE_ID", "ROLE_ID"] # Banear usuarios
  tempban: ["ROLE_ID", "ROLE_ID"] # Baneo temporal
  clearchannel: ["ROLE_ID", "ROLE_ID"] # Limpiar canal
  clearhistory: ["ROLE_ID", "ROLE_ID"] # Limpiar historial
  cleartimeout: ["ROLE_ID", "ROLE_ID"] # Quitar silencio
  embed: ["ROLE_ID", "ROLE_ID"] # Crear embeds
  history: ["ROLE_ID", "ROLE_ID"] # Ver historial de moderación
  kick: ["ROLE_ID", "ROLE_ID"] # Expulsar usuarios
  poll: ["ROLE_ID", "ROLE_ID"] # Crear encuestas
  purge: ["ROLE_ID", "ROLE_ID"] # Eliminar mensajes en masa
  removerole: ["ROLE_ID", "ROLE_ID"] # Quitar rol a un usuario
  setnote: ["ROLE_ID", "ROLE_ID"] # Añadir nota a un usuario
  slowmode: ["ROLE_ID", "ROLE_ID"] # Activar modo lento
  timeout: ["ROLE_ID", "ROLE_ID"] # Silenciar usuario
  unban: ["ROLE_ID", "ROLE_ID"] # Desbanear usuario
  warn: ["ROLE_ID", "ROLE_ID"] # Advertir usuario
  unwarn: ["ROLE_ID", "ROLE_ID"] # Quitar advertencia
  temprole: ["ROLE_ID", "ROLE_ID"] # Rol temporal
  nickname: ["ROLE_ID", "ROLE_ID"] # Cambiar apodo
  lockdown: ["ROLE_ID", "ROLE_ID"] # Bloquear canal
  blacklist: ["ROLE_ID", "ROLE_ID"] # Gestionar lista negra
  crypto: ["ROLE_ID", "ROLE_ID"] # Comandos de cripto

PurgeLogChannel: "CHANNEL_ID" # Canal donde se registran las purgas de mensajes

Warnings:
  Expiry: "30d" # Las advertencias expiran en 30 días (ejemplo: 1d 15m = 1 día 15 minutos)

  Punishments: # Castigos automáticos según número de advertencias
    1:
      Timeout: "" # Dejar vacío para sin castigo
    2:
      Timeout: "10m" # Silencio de 10 minutos
    3:
      Timeout: "15m" # Silencio de 15 minutos (soporta hasta 30 días)

AutoKick: # Expulsión automática por no verificarse
  Enabled: false # ¿Activar expulsión automática?
  Time: "10s" # Tiempo antes de expulsar (ejemplo: 1h 15s = 1 hora 15 segundos)
  Role: ["ROLE_ID", "ROLE_ID"] # El usuario necesita uno de estos roles para no ser expulsado
  DM:
    Enabled: true # ¿Enviar DM al usuario expulsado?
    Embed:
      Title: "⚠️ Fallo de Verificación ⚠️"
      Description:
        - "🚫 **Aviso:** No completaste la verificación en el tiempo dado."
        - "Por favor vuelve a unirte y verifica para permanecer en nuestro servidor. discord.gg/fluxobot"
      Color: "#1769FF"
      Footer: "Expulsión Automática | fluxoBot"


# Sistema de Prevención de Cuentas Alternativas
AltPrevention:
  Enabled: false # ¿Activar prevención de cuentas alt?
  TimeLimit: "30d" # Antigüedad mínima de cuenta requerida
  KickAlts: true # ¿Expulsar cuentas alt detectadas?

  DM:
    Enabled: true # ¿Enviar DM a la cuenta alt?
    Embed:
      Title: "⚠️ Alerta de Cuenta Alternativa ⚠️"
      Description:
        - "🚫 **Aviso:** Tu cuenta es demasiado nueva para unirse a {guildName}."
        - "🕒 **Antigüedad de la Cuenta:** {user-createdAt}"
        - "🛑 **Antigüedad Requerida:** 30 días"
        - "Por favor vuelve cuando tu cuenta cumpla el requisito de antigüedad."
        - "**📅 Fecha de Detección:** {longTime}"
      Footer:
        Text: "Sistema de Detección de Alts | {guildName}"
        Icon: "{guildIcon}"
      Author:
        Text: "{userName}"
        Icon: "{user-avatar}"
      Color: "#1769FF"
      Image: "{userBanner}"
      Thumbnail: "{user-avatar}"

  Log:
    LogsChannelID: "CHANNEL_ID"
    Title: "⚠️ Posible Cuenta Alternativa Detectada ⚠️"
    Description:
      - "**👤 Usuario:** {user} (ID: {userId})"
      - "🕒 **Antigüedad de la Cuenta:** {user-createdAt}"
      - "**👢 Expulsado:** {kickStatus}"
      - "🛑 **Antigüedad Requerida:** 30 días"
      - "**📅 Fecha de Detección:** {longTime}, {shortTime}"
    Footer:
      Text: "Sistema de Detección de Alts | {guildName}"
      Icon: "{guildIcon}"
    Author:
      Text: "{userName}"
      Icon: "{user-avatar}"
    Color: "#1769FF"
    Image: "{userBanner}"
    Thumbnail: "{user-avatar}"

# Sistema de Palabras en Lista Negra
BlacklistWords:
  Enabled: false # ¿Activar filtro de palabras prohibidas?
  Patterns: # Patrones de palabras bloqueadas
    - "example.net"        # Coincidencia exacta
    - "*.example.com"      # Coincide con cualquier subdominio de example.com
    - "discord.gg/*"       # Coincide con cualquier ruta después de discord.gg/
    - "*badword*"          # Coincide con "badword" en cualquier parte del texto
    - "http:*"             # Coincide con cualquier texto que empiece con http:
    - "www.*"              # Coincide con cualquier texto que empiece con www.
    - "regex:\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"  # Regex de correo electrónico
    - "regex:\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b" # Regex de dirección IP
  WhitelistWords: # Palabras permitidas aunque estén en la lista negra
    - "discord.gg/fluxobot"
  WhitelistChannels: # Canales donde NO aplica el filtro
    - "CHANNEL_ID"
  WhitelistCategories: # Categorías donde NO aplica el filtro
    - "CATEGORY_ID"
  BypassPerms: ["ManageMessages"] # Permisos que permiten saltarse el filtro
  BypassRoles: ["ROLE_ID"] # Roles que pueden saltarse el filtro
  Message: "¡{user}, usaste una palabra prohibida!"
  DM:
    Enabled: true # ¿Enviar DM al usuario?
    Message: "Hola {user}, enviaste una palabra prohibida, **{blacklistedword}**. \n Por favor abstente de hacerlo en el futuro."
    Type: "Message" # Message (Mensaje) o Embed
    Embed:
      Title: "🚫 Palabra Prohibida Detectada"
      Description:
        - "Hola {user}, enviaste una palabra prohibida"
        - "🔍 **Palabra Prohibida:** {blacklistedword}"
        - "🚫 **Acción:** Tu mensaje fue eliminado"
        - "**🕰️ Hora:** {longtime}, {shorttime}"
      Color: "#1769FF"
      Footer: "fluxoBot | {shorttime}"
      Thumbnail: true
  LogsChannelID: "CHANNEL_ID"
  Embed:
    Title: "🚫 Detección de Palabra Prohibida"
    Description:
      - "🚨 **Alerta:** {user} usó una palabra prohibida"
      - "🔍 **Palabra Infractora:** {blacklistedword}"
      - "🚫 **Consecuencia:** El mensaje fue eliminado"
      - "**🕰️ Fecha y Hora:** {longtime}, {shorttime}"
    Footer:
      Text: "fluxoBot | {guildName}"
      Icon: "{guildIcon}"
    Author:
      Text: ""
      Icon: ""
    Color: "#1769FF"
    Image: "{userBanner}"
    Thumbnail: ""

AntiNuke:
  Enabled: false # ¿Activar protección Anti-Nuke?
  WhitelistedRoles: ["ROLE_ID1", "ROLE_ID2"] # Roles exentos de la protección

  Default: # Aplica a todos los que tengan poder en el servidor (silenciar, expulsar, banear, gestionar servidor, etc.)
    Tiers:
      Tier1: # Primer nivel de protección
        Protection:
          kickThreshold: 2 # Máximo de expulsiones antes de activar
          banThreshold: 2 # Máximo de baneos antes de activar
          channelDeleteThreshold: 2 # Máximo de canales eliminados antes de activar
          roleDeleteThreshold: 2 # Máximo de roles eliminados antes de activar
          duration: "10s" # Ventana de tiempo para evaluar la actividad
        Actions:
          notify: ["USER_ID1", "USER_ID2"] # IDs de usuarios a notificar
          removeRole: false # ¿Quitar el rol de moderación al infractor?
          mute: true # Silenciar al infractor (el bot no puede silenciar si tienen admin)
          ban: false # ¿Banear al infractor?
        Logs:
          Enabled: true
          Embed:
            Title: "Anti Nuke - Nivel 1"
            Description:
              - "👤 **Usuario:** {user}"
              - "🔍 **Detonante:** {threshold}"
              - "🚫 **Cantidad:** {threshold_amount}"
              - "**📅 Fecha:** {timestamp}"
            Color: "#1769FF"
            Footer: "Anti Nuke | fluxoBot"
            Thumbnail: true
            LogsChannelID: "CHANNEL_ID" # Pon "" para desactivar

      Tier2: # Segundo nivel - umbrales más estrictos - Continúa desde el Nivel 1
        Protection:
          kickThreshold: 4 # 2 expulsiones más que el nivel 1
          banThreshold: 4
          channelDeleteThreshold: 4
          roleDeleteThreshold: 4
          duration: "20s"
        Actions:
          notify: ["USER_ID1", "USER_ID2"]
          removeRole: true # ¿Quitar el rol de moderación al infractor?
          mute: false
          ban: false
        Logs:
          Enabled: true
          Embed:
            Title: "Anti Nuke - Nivel 2"
            Description:
              - "👤 **Usuario:** {user}"
              - "🔍 **Detonante:** {threshold}"
              - "🚫 **Cantidad:** {threshold_amount}"
              - "**📅 Fecha:** {timestamp}"
            Color: "#1769FF"
            Footer: "Anti Nuke | fluxoBot"
            Thumbnail: true
            LogsChannelID: "CHANNEL_ID"

        # Soporta niveles ilimitados

# Sistema Anti-Hoist (evita que usuarios se pongan arriba en la lista con caracteres especiales)
AntiHoist:
  EnableOnUserJoin: false # ¿Activar al unirse al servidor?
  EnableOnUserUpdate: false # ¿Activar cuando el usuario edita su perfil?
  DefaultDisplayName: "zName" # Nombre por defecto si el apodo solo tiene caracteres no permitidos
  AllowRoles: ["ROLE_ID"] # Roles que pueden usar el comando
  DisallowedCharacters: ['-', '_', '!', '?', '.', '"'] # Caracteres a eliminar del inicio del nombre
  LogsChannelID: "CHANNEL_ID"
  LogEmbed:
    Title: "☢️ Apodo de Usuario Cambiado"
    Description:
      - "**👤 Usuario:** {user}"
      - "🟥 **Nombre Anterior:** `{oldDisplayName}`"
      - "🟩 **Nombre Nuevo:** `{newDisplayName}`"
    Color: "#1769FF"
    Footer: "Sistema Anti-Hoist | fluxoBot"
    Thumbnail: true

# Anti Mención Masiva
AntiMassMention:
  Enabled: false # ¿Activar anti menciones masivas?
  Amount: 5 # Cantidad de menciones en un mensaje para considerarse masivo
  BypassPerms: ["ManageMessages"] # Permisos que permiten saltarse el filtro
  BypassRoles: ["ROLE_ID"] # Roles que pueden saltarse el filtro
  Message: "¡{user}, las menciones masivas no están permitidas aquí!"
  TimeoutUser: true # ¿Silenciar al usuario?
  TimeoutTime: "5m" # Duración del silencio
  LogsChannelID: "CHANNEL_ID"
  SendDM: true # ¿Enviar DM al usuario?
  DirectMessage: "{user} has sido silenciado por {time} por hacer menciones masivas."

# Anti Spam
AntiSpam:
  Enabled: false # ¿Activar anti spam?
  MsgLimit: 5 # Cantidad de mensajes en el tiempo definido para considerarse spam
  TimeLimit: "1s" # Ventana de tiempo
  BypassPerms: ["ManageMessages"]
  BypassRoles: ["ROLE_ID"]
  Message: "¡{user}, el spam no está permitido aquí!"
  TimeoutUser: true # ¿Silenciar al usuario?
  TimeoutTime: "3m" # Duración del silencio
  LogsChannelID: "CHANNEL_ID"
  SendDM: true
  DirectMessage: "{user} has sido silenciado por {time} por hacer spam."

AntiGhostPing: # Evita que mencionen y borren el mensaje (ghost ping)
  Enabled: false # ¿Activar anti ghost ping?
  TimeLimit: "2s" # Tiempo máximo para detectar el ghost ping
  TimeoutUser: true # ¿Silenciar al usuario?
  TimeoutTime: "1m"
  BypassPerms: ["ManageMessages"]
  BypassRoles: ["ROLE_ID"]
  Message: "¡{user}, hacer ghost ping no está permitido aquí!"
  LogsChannelID: "CHANNEL_ID"
  SendDM: true
  DirectMessage: "{user}, has sido silenciado por {time} por hacer ghost ping."

# ===========================================================================
# CONFIGURACIÓN DE MENSAJES DE BIENVENIDA/DESPEDIDA
# ===========================================================================
# Variables disponibles:
# {userName}: YouSeeMeRunning
# {user}: @YouSeeMeRunning
# {userTag}: YouSeeMeRunning#1234
# {userId}: 264032125496459265 - Este es el ID
# {userBanner}: Muestra el banner del usuario en el campo de imagen
# {UserCreation}: ¿Qué tan antigua es su cuenta? Marca de tiempo de Discord
# {guildName}: Nombre del servidor
# {guildIcon}: Ícono del servidor
# {memberCount}: Conteo de miembros del servidor - 1°, 2°, 3°, 4°...
# {memberCountNumeric}: Muestra 5, 6, 7...
# {longTime}: 1 de marzo de 2023
# {shortTime}: 17:00
# {user-joinedAt}: Para mensajes de despedida, muestra cuándo se unió por primera vez
# {user-createdAt}: La fecha en que se creó la cuenta de Discord del usuario
# {kickStatus}: ¿El usuario fue expulsado o no?
# {autoKickTime}: ¿Cuánto tiempo hasta que el usuario sea expulsado?
# {invitedBy}: ¿Quién lo invitó?
# {invitedByCount}: ¿Cuántas invitaciones tiene la persona que lo invitó?
# {joinDate} # Marca de tiempo de Discord de cuando se unió
# {joinTime} # Marca de tiempo de Discord de cuando se unió
# {leaveDate} # Marca de tiempo de Discord de cuando se fue
# {leaveTime} # Marca de tiempo de Discord de cuando se fue

WelcomeMessage:
  Enabled: false # ¿Activar mensaje de bienvenida?
  ChannelID: "CHANNEL_ID" # Canal donde se envía el mensaje
  Type: "BOTH" # EMBED, MESSAGE (solo texto), BOTH (ambos - el texto aparece arriba del embed)
  Text: "Bienvenido a **{guildName}**, {userName}"
  Embed:
    Title: ""
    Description:
      - "¡Bienvenido a **{guildName}**, {userName}! Estamos encantados de tenerte en nuestra comunidad. 🎉"
      - ""
      - "Invitado por » {invitedBy} ({invitedByCount} invitaciones)"
      - "Fecha de ingreso » {joinDate} ({joinTime})"
      - "Antigüedad de cuenta » {UserCreation}"
      - "Miembros » {memberCount} miembro"
    Footer:
      Text: "{guildName} • Hoy a las {shortTime}"
      Icon: "{guildIcon}"
    Author:
      Text: "¡Bienvenido a {guildName}!"
      Icon: "https://static-00.iconduck.com/assets.00/hand-waving-icon-1875x2048-trzytj43.png"
    Color: "#1769FF"
    Image: "{userBanner}"
    Thumbnail: "{user-avatar}"

  DM:
    Enabled: false # ¿Enviar DM de bienvenida?
    Embed:
      Title: "¡Bienvenido, {userName}!"
      Description:
        - "¡Bienvenido a **{guildName}**, {userName}! Estamos encantados de tenerte en nuestra comunidad. 🎉"
        - "¡Eres nuestro miembro número {memberCount}!"
      Footer:
        Text: "{guildName} • Hoy a las {shortTime}"
        Icon: "{guildIcon}"
      Author:
        Text: "¡Bienvenido a {guildName}!"
        Icon: "https://static-00.iconduck.com/assets.00/hand-waving-icon-1875x2048-trzytj43.png"
      Color: "#1769FF"
      Image: "{userBanner}"
      Thumbnail: "{user-avatar}"

LeaveMessage:
  Enabled: false # ¿Activar mensaje de despedida?
  ChannelID: "CHANNEL_ID"
  Type: "BOTH"
  Text: "¡Adiós, {userName}!"
  Embed:
    Title: ""
    Description:
      - "¡Adiós, {userName}!"
      - "Esperamos verte pronto...."
    Footer:
      Text: "{guildName} • {shortTime}"
      Icon: "{guildIcon}"
    Author:
      Text: "👋 ¡Hasta pronto!"
      Icon: ""
    Color: "#1769FF"
    Image: ""
    Thumbnail: "{user-avatar}"

# ===========================================================================
# CONFIGURACIÓN DE ROLES AL UNIRSE / VERIFICACIÓN
# ===========================================================================
JoinRoleSettings:
  Enabled: false # ¿Activar roles automáticos al unirse?
  JoinRoles: ["ROLE_ID", "ROLE_ID"] # Roles que reciben los usuarios al unirse al servidor
  RestoreRoles: # ¿Devolver los roles originales si el usuario vuelve al servidor?
    Enabled: true
    Blacklist: ["ROLE_ID", "ROLE_ID"] # Roles que NO se devolverán
    Whitelist: ["ROLE_ID", "ROLE_ID"] # Solo estos roles serán devueltos

# Tipos de Verificación:
# BUTTON - Al hacer clic en el botón, el usuario recibe el rol especificado
# CALCULATOR - Resolver una pregunta matemática para recibir el rol
VerificationSettings:
  Enabled: false # ¿Activar sistema de verificación?
  DeleteAllMessages: true # ¿Eliminar todos los mensajes de usuarios en el canal de verificación?
  ChannelID: "CHANNEL_ID" # Canal donde los usuarios se verifican
  VerificationType: "BUTTON" # Opciones: BUTTON, CALCULATOR
  VerifiedRoleID: ["ROLE_ID"] # Roles que reciben al verificarse exitosamente
  RoleToRemove: "" # Rol a quitar al verificarse, dejar vacío para ninguno
  EnableUnverifiedRole: false # ¿Activar rol de no verificado? (Se crea automáticamente y bloquea acceso a todos los canales excepto el de verificación)

VerificationEmbed:
  Title: "Verificación"
  Description: "Por favor verifica para obtener acceso completo al servidor.\n¡Haz clic en el **botón** de abajo para verificarte!"
  Image: "https://i.imgur.com/R4qVpUy.png"

# Colores válidos para botones:
# Primary = azul violeta
# Secondary = gris
# Success = verde
# Danger = rojo
VerificationButton:
  Name: "Verificar"
  Emoji: "✅"
  Color: "Secondary"

